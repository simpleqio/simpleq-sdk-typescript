name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly contract sweep — catches platform-side wire changes even when this repo is quiet.
    - cron: '0 6 * * 1'
  repository_dispatch:
    # Fire from the platform's docs deploy for event-driven drift detection:
    #   gh api repos/simpleqio/simpleq-sdk-typescript/dispatches -f event_type=contract-changed
    types: [contract-changed]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm test

  # Verifies the SDK's types against the published OpenAPI spec (see CONTRIBUTING.md).
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contract
        env:
          # On a platform `contract-changed` dispatch, this is the sha256 of the spec that
          # was live BEFORE the platform's docs deploy; check:contract waits until the live
          # spec differs from it before asserting, so it checks the NEW spec. Empty on
          # push/PR/cron → single fetch, no wait.
          SIMPLEQ_PREV_SPEC_SHA256: ${{ github.event.client_payload.prevSpecSha256 }}
